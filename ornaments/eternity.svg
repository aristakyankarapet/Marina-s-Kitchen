<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -50 100 100">
  <!-- Armenian eternity sign (arevakhach): eight swirling rays -->
  <defs>
    <path id="ray" d="M0 0 C6 -10 20 -16 34 -12 C38 -4 34 6 26 10 C30 2 28 -6 20 -8 C12 -9 4 -5 0 0Z"/>
  </defs>
  <g fill="#C9A45C">
    <use href="#ray"/>
    <use href="#ray" transform="rotate(45)"/>
    <use href="#ray" transform="rotate(90)"/>
    <use href="#ray" transform="rotate(135)"/>
    <use href="#ray" transform="rotate(180)"/>
    <use href="#ray" transform="rotate(225)"/>
    <use href="#ray" transform="rotate(270)"/>
    <use href="#ray" transform="rotate(315)"/>
  </g>
  <circle r="44" fill="none" stroke="#C9A45C" stroke-width="1.5"/>
  <circle r="47.5" fill="none" stroke="#C9A45C" stroke-width=".75"/>
</svg>
